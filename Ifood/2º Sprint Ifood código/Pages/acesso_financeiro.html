<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
  <body>
    <aside class="col-md-2 d-none d-md-block bg-light sidebar">
        <div class="sidebar-sticky">
          <h2>Financeiro
            <button class="btn btn-outline-danger btn-sair" onclick="voltarParaPaginaInicial()"></button>
          </h2>
            <nav>
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link active">
                  Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link saldo" href="saldo_transacoes.html">
                  Saldo e transações
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link pagamento" href="pagamento_recebidos.html">
                  Pagamentos e recebíveis
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link relatorio" href="relatorios.html">
                  Relatórios e análises
                </a>
              </li> 
              <li class="icone-ifood">
                <h2></h2>
              </li>         
            </ul>
          </nav>
        </div>
      </aside>

      <div class="container mt-4">
        <h1 class="mb-4">Dashboard Financeiro</h1>
        
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Saldo</h5>
                        <p class="card-text" id="saldo">R$ 5000,00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Despesas</h5>
                        <p class="card-text" id="despesas">R$ 1200,00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Receitas</h5>
                        <p class="card-text" id="receitas">R$ 2000,00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Faturamento</h5>
                        <p class="card-text" id="faturamento">R$ 8000,00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Gráfico de Despesas</h5>
                        <canvas id="graficoDespesas"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Gráfico de Receitas</h5>
                        <canvas id="graficoReceitas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
        

  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      function voltarParaPaginaInicial() {
          window.location.href = 'index.html';
      }
  </script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/JS/script_finanças.js"></script>  

  <script>
    const allowedPages = [
        "index.html",
        "acesso_financeiro.html",
        "pagamento_recebidos.html",
        "relatorios.html",
        "saldo_transacoes.html",
        "template.html"
    ];

    const referrer = document.referrer;

    const isAllowed = allowedPages.some(page => referrer.includes(page));

    if (!isAllowed) {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
