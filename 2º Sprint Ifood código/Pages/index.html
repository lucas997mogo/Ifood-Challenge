<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

    <div class="login-container">
        <h3 class="text-center">Login</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Nome de Usuário</label>
                <input type="text" class="form-control" id="username" placeholder="Insira seu nome de usuário" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="Insira sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      
        <div class="divider">------------ ou continue com: ------------</div>

        <button class="btn btn-outline-danger btn-google">Google</button>
        <button class="btn btn-outline-danger btn-ifood">Ifood</button>

        <div class="terms">
            Ao clicar em continuar, você concorda com nossos <a href="#">termos</a> e <a href="#">política de privacidade</a>.
        </div>
        <div id="message" class="mt-3 text-center"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/script.js"></script>
</body>
</html>
